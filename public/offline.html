<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2e22" />
    <title>Sedang Offline — PORTAL REP</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 24px 16px; background: #07130f; color: #e2e8f0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%; max-width: 380px; text-align: center; padding: 28px 22px; border-radius: 24px;
        background: #0b241b; border: 2px solid rgba(245, 158, 11, 0.35);
      }
      img { width: 72px; height: 72px; border-radius: 18px; object-fit: cover; }
      h1 { font-size: 20px; margin: 16px 0 8px; color: #fff; }
      p { font-size: 14px; line-height: 1.55; color: #cbd5e1; margin: 0 0 18px; }
      button {
        width: 100%; padding: 12px 16px; border: 0; border-radius: 14px; cursor: pointer;
        background: #d97706; color: #fff; font-weight: 700; font-size: 14px;
      }
      button:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
      small { display: block; margin-top: 14px; color: #94a3b8; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/rep-logo.jpg" alt="Logo Yayasan Rumah Etnik Papua" />
      <h1>Anda sedang offline</h1>
      <p>Halaman ini belum tersimpan di perangkat. Periksa koneksi internet Anda, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
      <small>PORTAL REP · Yayasan Rumah Etnik Papua</small>
    </main>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
